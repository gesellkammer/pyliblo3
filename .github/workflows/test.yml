name: Test
on: [push, pull_request]
jobs:
  alltest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [
            "windows-latest",
            "ubuntu-latest",
            "macos-latest"
            ]
        python-version: [ "3.10", "3.13", "3.14"]   # Oldest supported, previous and latest.
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Windows - Enable Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.7.0

      - name: Install liblo (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y liblo-dev

      - name: Install liblo (macOS)
        if: runner.os == 'macOS'
        run: brew install liblo

      - name: Install liblo (Windows)
        if: runner.os == 'Windows'
        run: |
          git clone https://github.com/radarsat1/liblo
          cd liblo
          New-Item -ItemType Directory -Force -Path "windowsbuild"
          cd windowsbuild
          cmake -A x64 -DCMAKE_GENERATOR_PLATFORM=x64 -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=OFF -DWITH_CPP_TESTS=OFF -DWITH_EXAMPLES=OFF -DWITH_TOOLS=OFF ../cmake
          cmake --build . --config Release
          cmake --install .

      - name: Install pyliblo3 from source
        run: python -m pip install .

      - name: Run unittests
        run: python test/unit.py
